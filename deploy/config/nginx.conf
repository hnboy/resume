# ============================================================
# 简历生成器 - Nginx 配置文件
# 部署方式：将此文件复制到 /etc/nginx/conf.d/resume-generator.conf
# 然后执行: sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# ---------- 后端 API 服务 ----------
upstream resume_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

# ---------- HTTP 站点（可选自动跳转到 HTTPS）----------
server {
    listen 80;
    server_name _;
    # 如果有域名，取消下面注释并替换为实际域名，同时删除上面的 server_name _;
    # server_name resume.example.com;
    # return 301 https://$server_name$request_uri;

    # ---------- 前端静态文件 ----------
    location / {
        root /opt/resume-generator/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;

        # 缓存静态资源
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ---------- 后端 API 反向代理 ----------
    location /api/ {
        proxy_pass http://resume_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ---------- 健康检查 ----------
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}

